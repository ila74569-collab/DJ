name: Уведомления Дропа в Telegram
on:
  repository_dispatch:
    types: [drop-order]
jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Отправить сообщение
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
          TEXT: ${{ github.event.client_payload.text }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "Не заданы секреты TG_BOT_TOKEN и TG_CHAT_ID"; exit 1; fi
          code=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=HTML" --data-urlencode "disable_web_page_preview=true")
          echo "Telegram ответил: $code"
          if [ "$code" != "200" ]; then grep -o '"description":"[^"]*"' /tmp/r.json || true; exit 1; fi
