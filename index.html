<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0918">
<title>Дроп — закажи трек у DJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"></noscript>
<style>
/* Layout: club-night control room — guest phone on the left, DJ console on the right; on phones they become two tabs */
:root{
  --ink:#0E0918;
  --panel:#18112A;
  --panel-2:#221838;
  --panel-3:#2C2146;
  --line:rgba(236,226,255,.09);
  --line-2:rgba(236,226,255,.16);
  --text:#F7F2FF;
  --muted:#A89BC2;
  --dim:#6F6488;
  --coral:#FF4F6D;
  --amber:#FFB23E;
  --mint:#38E8C2;
  --sky:#6FB8FF;
  --stage:linear-gradient(115deg,#FF4F6D 0%,#FF7A4D 48%,#FFB23E 100%);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 32px;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--ink)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:10px}

/* ambient stage lights */
.lights{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.lights i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.22;animation:drift 18s ease-in-out infinite alternate}
.lights i:nth-child(1){background:var(--coral);left:-14vmax;top:-12vmax}
.lights i:nth-child(2){background:var(--amber);right:-16vmax;top:20vh;animation-duration:23s;opacity:.14}
.lights i:nth-child(3){background:#7A4DFF;left:20vw;bottom:-26vmax;animation-duration:27s;opacity:.16}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.12)}}

.wrap{position:relative;z-index:1;max-width:1220px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;background:linear-gradient(var(--ink) 70%,transparent)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.02em}
.logo b{background:var(--stage);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .disc{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,var(--ink) 0 18%,var(--amber) 19% 26%,#1b1428 27% 100%);box-shadow:0 0 0 2px var(--coral) inset;animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.demo-tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);border-radius:99px;padding:5px 10px}

.seg{display:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;position:relative}
.seg button{position:relative;z-index:1;padding:9px 14px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);transition:color .25s}
.seg button[aria-selected="true"]{color:#1a0d14}
.seg .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 6px);border-radius:10px;background:var(--stage);transition:transform .35s cubic-bezier(.6,.2,.2,1.2)}
.seg.right .knob{transform:translateX(calc(100% + 4px))}
.seg .ping{position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 var(--mint);animation:ping 1.4s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

.stage{padding-top:6px}
.stage:not([data-view="guest"]) .col-guest,.stage:not([data-view="login"]) .col-login,.stage:not([data-view="dj"]) .col-dj{display:none}
.col-guest{max-width:460px;margin:0 auto;animation:rise .4s ease}
.col-dj{max-width:1000px;margin:0 auto;animation:rise .4s ease}
.logo{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:default}
.logo.holding .disc{animation-duration:.5s}

/* login */
.login{max-width:380px;margin:40px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:26px 22px;display:flex;flex-direction:column;gap:12px;animation:rise .4s ease}
.login h2{font-family:var(--f-display);font-size:22px;margin:4px 0 0}
.login p{margin:0;color:var(--muted);font-size:14px}
.lock{width:52px;height:52px;border-radius:16px;background:var(--stage);color:#1d0b12;display:grid;place-items:center}
.pin{font-family:var(--f-mono);font-size:24px;letter-spacing:.5em;text-align:center}
.err{color:var(--coral)!important;font-size:13px!important}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.min-lbl{font-size:12.5px;color:var(--muted);font-weight:600}

/* amount picker */
.amts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.3fr);gap:6px}
.amt{position:relative;padding:12px 0;border-radius:13px;border:1.5px solid var(--line-2);font-family:var(--f-mono);font-weight:700;font-size:14px;transition:transform .15s,border-color .2s,background .2s,color .2s}
.amt:active{transform:scale(.93)}
.amt[aria-pressed="true"]{background:var(--stage);border-color:transparent;color:#1d0b12;box-shadow:0 8px 20px -10px rgba(255,79,109,.8)}
.amt-own{display:flex;align-items:center;border-radius:13px;border:1.5px solid var(--line-2);padding:0 10px;gap:4px;transition:border-color .2s;min-width:0}
.amt-own:focus-within,.amt-own.on{border-color:var(--amber)}
.amt-own input{width:100%;min-width:0;background:none;border:0;outline:0;font-family:var(--f-mono);font-weight:700;font-size:14px;padding:12px 0}
.amt-own input::placeholder{color:var(--dim);font-family:var(--f-body);font-weight:600}
.amt-own span{color:var(--muted);font-family:var(--f-mono);font-size:13px}
.amt-hint{margin:8px 0 0 2px;font-size:12.5px;color:var(--muted);min-height:18px;transition:color .2s}
.amt-hint.warn{color:var(--coral)}
.amt-hint.hot{color:var(--amber)}
.cta .sum-n{display:inline-block}
.cta .sum-n.bump{animation:bump .4s ease}
.tipchip{font-family:var(--f-mono);font-size:10.5px;font-weight:700;color:#1d0b12;background:var(--amber);padding:2px 7px;border-radius:99px}
.req.big{border-color:rgba(255,178,62,.45);background:linear-gradient(120deg,rgba(255,178,62,.1),var(--panel-2) 55%)}
.req .money.big{font-size:14px}

/* ============ GUEST ============ */
.phone{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:30px;overflow:hidden;min-height:760px;box-shadow:0 30px 80px -30px rgba(255,79,109,.35)}
.phone-in{padding:20px 18px 26px;display:flex;flex-direction:column;gap:18px}

.np{position:relative;display:flex;gap:14px;align-items:center;padding:14px;border-radius:22px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.np::after{content:"";position:absolute;inset:auto -20% -60% 30%;height:120%;background:radial-gradient(closest-side,rgba(255,79,109,.28),transparent);pointer-events:none}
.vinyl{flex:none;width:64px;height:64px;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle,#120c1d 0 2px,#1c1430 2px 3px);box-shadow:0 0 0 1px var(--line-2),0 8px 24px -6px #000;animation:spin 4s linear infinite}
.vinyl::after{content:"";position:absolute;inset:24px;border-radius:50%;background:var(--stage);box-shadow:0 0 0 3px #120c1d}
.np-meta{min-width:0;flex:1;position:relative;z-index:1}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);display:flex;align-items:center;gap:8px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--coral);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.np-title{font-weight:800;font-size:16px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-artist{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px;flex:none;position:relative;z-index:1}
.eq span{width:4px;border-radius:2px;background:var(--stage);animation:eq 1s ease-in-out infinite}
.eq span:nth-child(1){animation-delay:-.2s}.eq span:nth-child(2){animation-delay:-.55s}.eq span:nth-child(3){animation-delay:-.1s}.eq span:nth-child(4){animation-delay:-.75s}
@keyframes eq{0%,100%{height:20%}50%{height:100%}}

.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,38px);line-height:1.02;letter-spacing:-.01em;margin:6px 0 8px;text-wrap:balance}
.hero h1 em{font-style:normal;background:var(--stage);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);font-size:14.5px}

.search{position:relative}
.field{display:flex;align-items:center;gap:10px;background:var(--ink);border:1.5px solid var(--line-2);border-radius:16px;padding:0 14px;transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:var(--coral);box-shadow:0 0 0 4px rgba(255,79,109,.16)}
.field svg{flex:none;color:var(--muted)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;padding:15px 0;font-size:16px;font-weight:600}
.field input::placeholder{color:var(--dim);font-weight:500}
.clear{color:var(--dim);padding:6px;border-radius:8px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:6;background:var(--panel-3);border:1px solid var(--line-2);border-radius:18px;padding:6px;box-shadow:0 24px 60px -12px rgba(0,0,0,.7);transform-origin:top;animation:pop .22s cubic-bezier(.2,.8,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-6px)}}
.s-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 10px;border-radius:13px;opacity:0;animation:rise .28s ease forwards}
.s-item[aria-selected="true"],.s-item:hover{background:rgba(255,255,255,.06)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.art{flex:none;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;color:rgba(255,255,255,.92);text-shadow:0 1px 6px rgba(0,0,0,.3)}
.s-text{min-width:0;flex:1}
.s-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-artist{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
mark{background:none;color:var(--amber);font-weight:800}
.chip{flex:none;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);border-radius:99px;padding:3px 8px}
.s-custom{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px;border-top:1px solid var(--line);margin-top:4px;color:var(--muted);font-size:13.5px;border-radius:0 0 13px 13px}
.s-custom:hover{color:var(--text)}
.s-empty{padding:14px;color:var(--muted);font-size:14px}

.pick{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:linear-gradient(var(--panel-2),var(--panel-2)) padding-box,var(--stage) border-box;border:1.5px solid transparent;animation:rise .35s ease}
.pick .art{width:52px;height:52px;border-radius:14px;font-size:18px}
.pick .s-title{font-size:16px}
.pick .x{margin-left:auto;color:var(--muted);padding:8px;border-radius:10px}

.inputs{display:grid;grid-template-columns:1fr;gap:10px}
.inp{background:var(--ink);border:1.5px solid var(--line-2);border-radius:14px;padding:12px 14px;outline:0;width:100%;font-size:15px;transition:border-color .2s}
.inp:focus{border-color:var(--amber)}
.inp::placeholder{color:var(--dim)}
.lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 6px 2px;display:flex;justify-content:space-between}
.lbl span{font-family:var(--f-mono);font-weight:500;color:var(--dim)}

.cta{position:relative;width:100%;padding:17px 18px;border-radius:18px;background:var(--stage);color:#1d0b12;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:10px;overflow:hidden;transition:transform .15s,filter .2s,opacity .2s;box-shadow:0 12px 30px -10px rgba(255,79,109,.7)}
.cta:active{transform:scale(.97)}
.cta:disabled{filter:grayscale(.85) brightness(.6);box-shadow:none;cursor:not-allowed}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.2s ease-in-out infinite}
.cta:disabled::after{display:none}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.fine{font-size:12.5px;color:var(--dim);text-align:center;margin-top:-8px}

.paused{padding:22px 18px;border-radius:20px;border:1.5px dashed var(--line-2);text-align:center;color:var(--muted)}
.paused strong{display:block;color:var(--text);font-family:var(--f-display);font-size:17px;margin-bottom:4px}

.my h3{font-family:var(--f-display);font-size:15px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.count{font-family:var(--f-mono);font-size:11px;background:var(--panel-3);color:var(--muted);border-radius:99px;padding:2px 8px}
.mylist{display:flex;flex-direction:column;gap:10px}
.mycard{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--panel-2);border:1px solid var(--line);animation:rise .4s ease;transition:border-color .4s,background .4s}
.mycard .s-text{min-width:0}
.mycard.st-playing{border-color:var(--coral);background:linear-gradient(120deg,rgba(255,79,109,.16),var(--panel-2) 60%)}
.mycard.st-queued{border-color:rgba(56,232,194,.4)}
.mycard.st-rejected{opacity:.62}
.status{margin-top:5px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px 3px 7px}
.status i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-pending .status{color:var(--amber);background:rgba(255,178,62,.12)}
.st-pending .status i{animation:blink 1s infinite}
.st-queued .status{color:var(--mint);background:rgba(56,232,194,.12)}
.st-playing .status{color:var(--coral);background:rgba(255,79,109,.15)}
.st-played .status{color:var(--sky);background:rgba(111,184,255,.12)}
.st-rejected .status{color:var(--muted);background:rgba(255,255,255,.06)}
.empty-my{padding:16px;border-radius:16px;border:1px dashed var(--line-2);color:var(--dim);font-size:13.5px;text-align:center}

/* pay sheet */
.scrim{position:absolute;inset:0;z-index:20;background:rgba(8,5,14,.62);backdrop-filter:blur(4px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--panel-3);border-radius:28px 28px 0 0;border-top:1px solid var(--line-2);padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .42s cubic-bezier(.2,.9,.25,1.1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line-2);margin:0 auto 16px}
.sheet h4{font-family:var(--f-display);font-size:18px;margin:0 0 14px}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-block:1px solid var(--line);margin-bottom:14px}
.sum .big{font-family:var(--f-display);font-weight:800;font-size:34px}
.sum .big small{font-size:18px;color:var(--muted);margin-left:2px}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.method{padding:12px;border-radius:14px;border:1.5px solid var(--line-2);text-align:left;font-weight:700;font-size:14px;transition:border-color .2s,background .2s}
.method small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.method[aria-pressed="true"]{border-color:var(--amber);background:rgba(255,178,62,.08)}
.hold{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);background:rgba(56,232,194,.07);border:1px solid rgba(56,232,194,.22);border-radius:14px;padding:10px 12px;margin-bottom:16px}
.hold svg{flex:none;color:var(--mint);margin-top:1px}
.spin{width:54px;height:54px;border-radius:50%;border:4px solid var(--line-2);border-top-color:var(--coral);border-right-color:var(--amber);animation:spin .8s linear infinite;margin:18px auto 14px}
.done{text-align:center;padding:8px 0 4px}
.check{width:76px;height:76px;margin:6px auto 12px;border-radius:50%;background:var(--stage);display:grid;place-items:center;animation:boom .5s cubic-bezier(.2,.9,.3,1.6)}
@keyframes boom{from{transform:scale(.2);opacity:0}}
.check svg path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s .25s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.center-txt{text-align:center;color:var(--muted);font-size:14px;margin:0 0 16px}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 1.6s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(820px) rotate(720deg);opacity:0}}

.toast{position:absolute;left:14px;right:14px;top:14px;z-index:30;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:rgba(44,33,70,.96);border:1px solid var(--line-2);box-shadow:0 18px 40px -10px #000;animation:drop .45s cubic-bezier(.2,.9,.3,1.3)}
.toast.out{animation:lift .35s ease forwards}
@keyframes drop{from{transform:translateY(-130%)}}
@keyframes lift{to{transform:translateY(-140%);opacity:0}}
.toast .ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800}
.toast b{display:block;font-size:14px}
.toast span{font-size:12.5px;color:var(--muted)}

/* ============ DJ CONSOLE ============ */
.console{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.c-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:center}
.c-head h2{font-family:var(--f-display);font-size:22px;margin:0;font-weight:800}
.c-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.switch{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);font-weight:700;font-size:13.5px}
.track-sw{width:44px;height:26px;border-radius:99px;background:var(--panel-3);position:relative;transition:background .25s;flex:none}
.track-sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .3s cubic-bezier(.5,.2,.2,1.4),background .25s}
.switch[aria-checked="true"] .track-sw{background:rgba(56,232,194,.25)}
.switch[aria-checked="true"] .track-sw::after{transform:translateX(18px);background:var(--mint)}
.prices{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line)}
.prices button{padding:6px 11px;border-radius:10px;font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--muted)}
.prices button[aria-pressed="true"]{background:var(--text);color:var(--ink)}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}

<script>"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s).toLowerCase().replace(/ё/g, "е");
function hue(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; }
function cover(t, extra = "") {
  const h = hue(t.artist + t.title), ch = (String(t.artist).match(/[A-Za-zА-Яа-яЁё0-9]/) || ["♪"])[0].toUpperCase();
  const bg = `background:linear-gradient(135deg,hsl(${h} 80% 58%),hsl(${(h + 50) % 360} 85% 40%))`;
  if (t.cover) return `<span class="art ${extra}" style="${bg}" aria-hidden="true"><img src="${esc(t.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"><b>${esc(ch)}</b></span>`;
  return `<span class="art ${extra}" style="${bg}" aria-hidden="true"><b>${esc(ch)}</b></span>`;
}
function hl(text, tokens) {
  text = String(text);
  if (!tokens.length) return esc(text);
  const low = norm(text), mask = new Array(text.length).fill(false);
  for (const tk of tokens) { let i = low.indexOf(tk); while (i > -1) { if (i === 0 || /[\s\-&(.,'"]/.test(low[i - 1])) for (let j = i; j < i + tk.length; j++) mask[j] = true; i = low.indexOf(tk, i + 1); } }
  let out = "", on = false;
  for (let i = 0; i < text.length; i++) { if (mask[i] && !on) { out += "<mark>"; on = true; } if (!mask[i] && on) { out += "</mark>"; on = false; } out += esc(text[i]); }
  return out + (on ? "</mark>" : "");
}
async function api(p, opts = {}) {
  let r;

  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/current.json?t=${Date.now()}`, { cache: "no-store", headers: { Accept: "application/vnd.github.raw+json" } });
    const d = await r.json();

  setInterval(refreshMine, 15000); // запасной вариант, если живые обновления не доходят
})();
</script>
</body>
